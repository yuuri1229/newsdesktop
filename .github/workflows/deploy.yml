name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/personal-data-realtime-app-cvzdof]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # https://<user>.github.io/<repo>/ で配信するためのパス
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # 独自の CORS プロキシを使う場合はリポジトリ変数 CORS_PROXY を設定
          NEXT_PUBLIC_CORS_PROXY: ${{ vars.CORS_PROXY }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
